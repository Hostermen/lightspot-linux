[package]
name = "lightspot-files"
version = "0.3.2"
edition = "2021"
description = "Lightweight keyboard-driven launcher for Linux with app + file search"
license = "GPL-3.0-or-later"
repository = "https://github.com/Hostermen/lightspot-linux"
readme = "README.md"
authors = ["Hostermen"]
keywords = ["launcher", "search", "desktop", "linux"]
categories = ["command-line-utilities", "gui"]

[[bin]]
name = "lightspot-files"
path = "src/main.rs"

[dependencies]
evdev = "0.13.2"
tantivy = { version = "0.26", default-features = false, features = ["mmap", "lz4-compression"] }
notify = "6"
ignore = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
lto = false
strip = true
panic = "unwind"
