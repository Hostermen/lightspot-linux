[package]
name = "spotlight-files"
version = "0.1.0"
edition = "2021"
description = "Lightweight Spotlight-style launcher for Linux with app + file search"
license = "GPL-3.0"

[[bin]]
name = "spotlight-files"
path = "src/main.rs"

[dependencies]
evdev = "0.13.2"
tantivy = { version = "0.26", default-features = false, features = ["mmap", "lz4-compression"] }
notify = "6"
ignore = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
lto = false
strip = true
panic = "unwind"
