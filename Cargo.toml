[package]
name = "spotlight-files"
version = "0.1.0"
edition = "2021"
description = "Lightweight Spotlight-style launcher for Linux with app + file search"
license = "GPL-3.0"

[[bin]]
name = "spotlight-files"
path = "src/main.rs"

[dependencies]
evdev = "0.13.2"
gtk4 = "0.9"

[profile.release]
opt-level = 2
lto = false
strip = true
panic = "abort"
